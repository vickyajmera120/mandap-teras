# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Flyway manages schema, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Envers Audit Configuration
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.hibernate.envers.revision_on_collection_change=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Prevent Tomcat from opening 200 default idle handling threads.
# This is to save amount of RAM being utilized
server.tomcat.max-threads=10

# Following two sets of properties are added so that Railway can shutdown the application when idle.
# Otherwise, background thread of hibernate will keep running to check connection.
# Force Hikari to drop idle connections instead of keeping them open permanently
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5

# Remove any validation queries that actively ping the database on a timer
spring.datasource.hikari.connection-test-query=

